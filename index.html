<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>నిజమైన ద్రాక్షవల్లి – అనుదిన మన్న | JMBC Church Ongole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hind+Guntur:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#25103A;
  --vine:#4A1D6B;
  --vine-soft:#6B3A8C;
  --gold:#C9A24A;
  --gold-soft:#E8D49B;
  --leaf:#2F5D2A;
  --leaf-soft:#E3EEDF;
  --mist:#F6F2F8;
  --ink:#231A2C;
  --ink-soft:#5B4D68;
  --line:#DDD2E6;
  --fs:1;
  --display:'Cormorant Garamond','Noto Serif Telugu',Georgia,serif;
  --body:'Hind Guntur','Noto Sans Telugu',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--body);font-size:calc(17px*var(--fs));line-height:1.65;color:var(--ink);background:var(--mist);position:relative;overflow-x:hidden}
body[lang=te] .d, body[lang=te] h1, body[lang=te] h2, body[lang=te] h3{font-family:'Noto Serif Telugu','Cormorant Garamond',serif}
h1,h2,h3,.d{font-family:var(--display);font-weight:700;line-height:1.3}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px 0 40px}
@media(min-width:760px){.wrap{padding:0 40px 0 72px}}

/* vine that grows with scroll */
#vine{position:absolute;left:0;top:0;width:44px;height:100%;pointer-events:none;z-index:1}
#vine path.track{stroke:var(--line);fill:none;stroke-width:2}
#vine path.live{stroke:var(--leaf);fill:none;stroke-width:3;stroke-linecap:round}
#vine .leaf{fill:var(--leaf);opacity:0;transition:opacity .5s, transform .5s;transform-box:fill-box;transform-origin:center;transform:scale(.3)}
#vine .leaf.on{opacity:1;transform:scale(1)}
#vine .grape{fill:var(--vine);opacity:0;transition:opacity .5s}
#vine .grape.on{opacity:1}
@media(min-width:760px){#vine{left:14px;width:56px}}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(37,16,58,.96);backdrop-filter:blur(6px);color:#fff;border-bottom:1px solid rgba(201,162,74,.5)}
.bar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.bar img{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold)}
.bar .name{flex:1;line-height:1.2}
.bar .name b{display:block;font-size:1.02rem;color:var(--gold-soft)}
.bar .name span{font-size:.78rem;opacity:.8}
.pill{border:1.5px solid var(--gold);background:transparent;color:var(--gold-soft);border-radius:999px;padding:6px 14px;min-height:40px;font-weight:600;font-size:.9rem}
.pill:hover{background:rgba(201,162,74,.18)}
.nav{display:none}
@media(min-width:860px){
  .nav{display:flex;gap:4px;margin-right:8px}
  .nav a{text-decoration:none;padding:8px 12px;border-radius:8px;font-size:.95rem;color:#EADFF3}
  .nav a:hover{background:rgba(255,255,255,.1)}
}
.tabs{display:flex;position:sticky;top:61px;z-index:15;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
@media(min-width:860px){.tabs{display:none}}
.tabs a{flex:1;min-width:max-content;text-align:center;text-decoration:none;padding:11px 14px;font-weight:600;font-size:.92rem;color:var(--vine);border-bottom:3px solid transparent}
.tabs a.cur{border-bottom-color:var(--gold)}

/* hero */
.hero{background:radial-gradient(120% 90% at 85% 0%,#5A2480 0%,var(--night) 62%);color:#fff;padding:34px 0 46px;position:relative;z-index:2}
.hero .wrap{display:grid;gap:26px}
@media(min-width:860px){.hero .wrap{grid-template-columns:1.15fr .85fr;align-items:center}}
.hero h1{font-size:clamp(1.9rem,6.4vw,3.1rem);color:var(--gold-soft);letter-spacing:.2px}
.hero .sub{margin-top:6px;font-size:1.05rem;color:#E9DDF4;max-width:34em}
.today{background:#fff;color:var(--ink);border-radius:18px;padding:20px 20px 18px;border:2px solid var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.35);position:relative}
.today .when{font-size:.9rem;color:var(--vine);font-weight:600}
.today h2{font-size:1.4rem;margin:6px 0 4px;color:var(--vine)}
.today .ref{display:inline-block;background:var(--leaf-soft);color:var(--leaf);padding:2px 12px;border-radius:999px;font-weight:600;font-size:.9rem}
.today p{margin:12px 0 14px;color:var(--ink-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:12px;border:2px solid var(--vine);background:var(--vine);color:#fff;font-weight:600;text-decoration:none}
.btn:hover{background:var(--night);border-color:var(--night)}
.btn.alt{background:transparent;color:var(--vine)}
.btn.alt:hover{background:var(--mist)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--night)}
.btn.gold:hover{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--night)}
.sheet .row{margin-top:14px}
.btn.wa{background:#1E7A46;border-color:#1E7A46}
.btn.wa:hover{background:#155C34;border-color:#155C34}

/* sections */
section{padding:46px 0 10px;position:relative;z-index:2;scroll-margin-top:110px}
section h2.t{font-size:clamp(1.5rem,4.6vw,2.1rem);color:var(--vine)}
section .lead{color:var(--ink-soft);max-width:40em;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 18px;align-items:center}
.search{flex:1 1 220px;min-height:46px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:inherit;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:6px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;color:var(--ink-soft)}
.chip[aria-pressed=true]{background:var(--vine);color:#fff;border-color:var(--vine)}
.list{display:grid;gap:12px}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.item{text-align:left;background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--vine);border-radius:12px;padding:14px 16px;width:100%}
.item.research{border-left-color:var(--leaf)}
.item:hover{border-color:var(--vine-soft);box-shadow:0 6px 18px rgba(74,29,107,.12)}
.item .meta{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--ink-soft)}
.item .kind{font-weight:700;color:var(--vine)}
.item.research .kind{color:var(--leaf)}
.item h3{font-size:1.1rem;margin:4px 0 2px;color:var(--ink)}
.item .ref{font-size:.9rem;color:var(--ink-soft)}
.empty{padding:26px;text-align:center;color:var(--ink-soft);border:1.5px dashed var(--line);border-radius:12px;background:#fff}

/* research band */
.band{background:var(--leaf-soft);margin-top:40px;padding:6px 0 46px;position:relative;z-index:2}
.band section{padding-top:40px}

/* men's dept */
.meet{display:grid;gap:14px;margin-top:20px}
@media(min-width:760px){.meet{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:1.1rem;color:var(--vine);margin-bottom:4px}
.card.gold{border-color:var(--gold);background:linear-gradient(#fff,#FBF5E4)}
.verse{margin-top:28px;padding:22px;border-radius:16px;background:var(--night);color:#fff;text-align:center}
.verse .d{font-size:1.35rem;color:var(--gold-soft)}
.verse small{display:block;margin-top:4px;opacity:.8}

footer{background:var(--night);color:#D9CCE6;padding:30px 0 90px;margin-top:50px;position:relative;z-index:2;font-size:.95rem}
footer b{color:var(--gold-soft)}

/* reading sheet */
.scrim{position:fixed;inset:0;background:rgba(20,8,32,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 22px 28px;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:41;max-width:720px;margin:0 auto;border-top:4px solid var(--gold)}
.sheet.on{transform:none}
.grab{width:46px;height:5px;background:var(--line);border-radius:3px;margin:4px auto 12px}
.sheet h2{font-size:1.5rem;color:var(--vine);margin:6px 0}
.sheet ol{margin:12px 0 12px 22px}
.sheet li{margin:8px 0}
.sheet .note{font-size:.85rem;color:var(--ink-soft);margin-top:14px}
.x{position:absolute;right:14px;top:14px;border:0;background:var(--mist);width:42px;height:42px;border-radius:50%;font-size:1.2rem}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* active tab */
const secs=['today','manna','research','men'];
addEventListener('scroll',()=>{
  let c='today';secs.forEach(id=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<160)c=id});
  $$('.tabs a').forEach(a=>a.classList.toggle('cur',a.getAttribute('href')==='#'+c));
},{passive:true});

/* the vine: grows down the left edge as you read */
let leaves=[],live,len;
function buildVine(){
  const svg=$('#vine'),H=document.documentElement.scrollHeight,W=svg.clientWidth,mid=W/2,amp=Math.min(9,W/5);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('height',H);
  let d=`M${mid} 0`;const step=70;
  for(let y=0;y<H;y+=step){const s=(y/step)%2?1:-1;d+=` Q${mid+s*amp*2} ${y+step/2} ${mid} ${y+step}`}
  let g=`<path class="track" d="${d}"/><path class="live" d="${d}"/>`;
  for(let y=step*1.5,i=0;y<H-60;y+=step*2,i++){
    const s=i%2?1:-1,x=mid+s*(amp+5);
    g+=`<ellipse class="leaf" data-y="${y}" cx="${x}" cy="${y}" rx="9" ry="5" transform="rotate(${s*-35} ${x} ${y})"/>`;
    if(i%4===3)g+=`<g class="grape" data-y="${y+36}">`+[[0,0],[7,0],[3.5,6],[10,6],[7,12]].map(p=>`<circle cx="${mid-s*14+p[0]*s}" cy="${y+36+p[1]}" r="3.4"/>`).join('')+`</g>`;
  }
  svg.innerHTML=g;live=svg.querySelector('.live');len=live.getTotalLength();
  live.style.strokeDasharray=len;leaves=[...svg.querySelectorAll('.leaf,.grape')];grow();
}
function grow(){
  if(!live)return;
  const y=scrollY+innerHeight*0.7,H=document.documentElement.scrollHeight;
  live.style.strokeDashoffset=len*(1-Math.min(1,y/H));
  leaves.forEach(l=>l.classList.toggle('on',+l.dataset.y<y));
}
addEventListener('scroll',grow,{passive:true});
addEventListener('resize',buildVine);

const toSample=()=>SAMPLE.map(e=>{const d=new Date();d.setDate(d.getDate()-e.d);const {d:_,...r}=e;return {...r,date:iso(d)}});
ENTRIES=prep(toSample());
applyLang();buildVine();
fetch('content.json?'+Date.now()).then(r=>r.ok?r.json():null).then(j=>{
  if(j&&Array.isArray(j.entries)){ENTRIES=prep(j.entries);SET={...SET,...(j.settings||{})};applySettings();applyLang();buildVine()}
}).catch(()=>{});
document.fonts&&document.fonts.ready.then(buildVine);
